{% extends "base.html" %}

{% block title %}修改密码 - TeachFlow{% endblock %}

{% block content %}
<div class="page-header">
    <h1>修改密码</h1>
</div>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="POST" action="/settings/password" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-group">
        <label for="current_password">当前密码</label>
        <input type="password" id="current_password" name="current_password" required>
    </div>

    <div class="form-group">
        <label for="new_password">新密码</label><input type="password" id="new_password" name="new_password" placeholder="至少 8 个字符" required>
    </div>

    <div class="form-group">
        <label for="confirm_password">确认新密码</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">修改密码</button><a href="/settings" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
