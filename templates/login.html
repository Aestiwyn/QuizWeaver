{% extends "base.html" %}

{% block title %}登录 - TeachFlow{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo"></div>
        <h1>欢迎回来</h1>
        <p class="login-subtitle">登录后继续使用教师工作台</p>

        {% if demo_mode %}
        <div class="alert alert-info">
            公开演示账号：<strong>{{ demo_username }}</strong> / <strong>{{ demo_password }}</strong>
        </div>
        {% endif %}

        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" value="{{ demo_username if demo_mode else '' }}" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" value="{{ demo_password if demo_mode else '' }}" required>
            </div>

            <button type="submit" class="btn btn-primary">登录</button>
        </form>
    </div>
</div>
{% endblock %}
