{% extends "base.html" %}
{% block title %}编辑 {{ class_obj.name|class_display_name }} - QuizWeaver{% endblock %}

{% block content %}
<h1>编辑班级</h1>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="POST" action="/classes/{{ class_obj.id }}/edit" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-group">
        <label for="name">班级名称（必填）<span class="help-tip" data-tip="班级或课时段的唯一名称">?</span></label>
        <input type="text" id="name" name="name" value="{{ class_obj.name|class_display_name }}" required autocomplete="off">
    </div>
    <div class="form-group">
        <label for="grade_level">年级<span class="help-tip" data-tip="用于调整测验难度和词汇水平">?</span></label>
        <input type="text" id="grade_level" name="grade_level" value="{{ class_obj.grade_level or '' }}" autocomplete="off">
    </div>
    <div class="form-group">
        <label for="subject">学科</label>
        <input type="text" id="subject" name="subject" value="{{ class_obj.subject or '' }}" autocomplete="off">
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">保存更改</button><a href="/classes/{{ class_obj.id }}" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
