{% extends "base.html" %}
{% block title %}新建班级 - TeachFlow{% endblock %}

{% block content %}
<h1>新建班级</h1>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="POST" action="/classes/new" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-group">
        <label for="name">班级名称（必填）<span class="help-tip" data-tip="班级或课时段的唯一名称，例如“第三节生物课”">?</span></label>
        <input type="text" id="name" name="name" required placeholder="例如：七年级科学 A 班" autocomplete="off">
    </div>
    <div class="form-group">
        <label for="grade_level">年级<span class="help-tip" data-tip="用于调整测验难度和词汇水平">?</span></label>
        <input type="text" id="grade_level" name="grade_level" placeholder="例如：七年级" autocomplete="off">
    </div>
    <div class="form-group">
        <label for="subject">学科</label><input type="text" id="subject" name="subject" placeholder="例如：科学" autocomplete="off">
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">创建班级</button><a href="/classes" class="btn btn-secondary">取消</a>
    </div>
</form>
{% endblock %}
