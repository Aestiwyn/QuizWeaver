{% extends "base.html" %}

{% block title %}初始设置 - QuizWeaver{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo"></div>
        <h1>欢迎使用 QuizWeaver</h1><p class="login-subtitle">请先创建管理员账户</p>

        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/setup">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="username">用户名</label><input type="text" id="username" name="username" placeholder="设置用户名" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="display_name">显示名称（可选）</label><input type="text" id="display_name" name="display_name" placeholder="你的姓名" autocomplete="name">
            </div>

            <div class="form-group">
                <label for="password">密码</label><input type="password" id="password" name="password" placeholder="至少 8 个字符" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">确认密码</label><input type="password" id="confirm_password" name="confirm_password" placeholder="再次输入密码" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn btn-primary">创建账户</button>
        </form>
    </div>
</div>
{% endblock %}
