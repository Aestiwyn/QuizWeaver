<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}TeachFlow{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#74677f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/teachflow-192.png') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/teachflow.ico') }}" sizes="any">
    <link rel="icon" href="{{ url_for('static', filename='icons/teachflow.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loading.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/accessibility.css') }}">
    <script>
    // Apply saved theme immediately to prevent flash
    (function() {
        var saved = localStorage.getItem('qw-theme');
        if (saved) {
            document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        // Apply saved accessibility preferences immediately to prevent flash
        var a11y = localStorage.getItem('qw-a11y');
        if (a11y) {
            try {
                var prefs = JSON.parse(a11y);
                // We apply classes to body once it exists (see DOMContentLoaded below)
                // Store for later use
                window.__qwA11y = prefs;
            } catch(e) {}
        }
    })();
    </script>
</head>
<body>
    <a href="#main-content" class="skip-nav">跳到主要内容</a>

    <nav class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-brand">
            <a href="/dashboard">TeachFlow</a>
        </div>
        <button class="nav-toggle" aria-label="展开或收起导航" aria-controls="mainNav" aria-expanded="false" onclick="toggleMobileNav()">
            <span class="hamburger"></span>
        </button>
        <ul class="nav-links" id="mainNav" role="menubar">
            <li role="none"><a href="/dashboard" role="menuitem">首页</a></li>
            <li role="none"><a href="/classes" role="menuitem">班级</a></li>
            <li role="none"><a href="/generate" role="menuitem">生成测验</a></li>
            <li role="none"><a href="/quizzes" role="menuitem">测验</a></li>
            <li role="none"><a href="/settings" role="menuitem">设置</a></li>
            <li role="none"><a href="/help" role="menuitem">帮助</a></li>
        </ul>
        <div class="nav-user-section">
            {% if current_user and current_user.display_name %}
            <svg class="nav-user-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="nav-user-name">{{ current_user.display_name }}</span>
            {% endif %}
            <form method="POST" action="/logout" style="display:inline;margin:0;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <button type="submit" class="btn btn-sm btn-secondary">退出登录</button>
            </form>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换深色模式" title="切换深色模式">
            <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </nav>
    <div class="nav-backdrop" id="navBackdrop" onclick="toggleMobileNav()" aria-hidden="true"></div>

    <main class="container" id="main-content" role="main" aria-label="页面内容">
        {% block content %}{% endblock %}
    </main>

    <div class="toast-container" id="toastContainer" aria-live="polite" role="status"></div>

    <footer class="footer" role="contentinfo" aria-label="网站页脚">
        <p>TeachFlow 教师助手</p>
        <p class="shortcuts-hint" id="shortcutsHint">按 <kbd>?</kbd> 查看快捷键</p>
    </footer>

    <script>
    // --- Mobile Nav Toggle ---
    function toggleMobileNav() {
        var navLinks = document.querySelector('.nav-links');
        var backdrop = document.getElementById('navBackdrop');
        var userSection = document.querySelector('.nav-user-section');
        var toggle = document.querySelector('.nav-toggle');
        var isOpen = navLinks.classList.toggle('open');
        backdrop.classList.toggle('open', isOpen);
        toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        if (userSection) {
            userSection.classList.toggle('open', isOpen);
        }
    }

    // --- Theme Toggle ---
    function toggleTheme() {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('qw-theme', next);
    }

    // Listen for system theme changes
    if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (!localStorage.getItem('qw-theme')) {
                document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            }
        });
    }

    // --- CSS Variable Helper (for Chart.js) ---
    function getCSSVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    // --- Toast Notifications ---
    function showToast(message, type, duration) {
        type = type || 'info';
        duration = duration || 5000;
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.innerHTML = '<span class="toast-message">' + message + '</span>' +
            '<button class="toast-close" aria-label="关闭提示" onclick="this.parentElement.remove()">&times;</button>' +
            '<div class="toast-progress"><div class="toast-progress-bar" style="animation-duration:' + duration + 'ms"></div></div>';
        container.appendChild(toast);
        // Trigger reflow for animation
        toast.offsetHeight;
        toast.classList.add('toast-show');
        setTimeout(function() {
            toast.classList.add('toast-hide');
            setTimeout(function() { toast.remove(); }, 300);
        }, duration);
    }

    // Render flash messages as toasts
    document.addEventListener('DOMContentLoaded', function() {
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                showToast({{ message|tojson }}, {{ category|tojson }});
                {% endfor %}
            {% endif %}
        {% endwith %}

        // --- Keyboard shortcuts hint visibility ---
        var hint = document.getElementById('shortcutsHint');
        if (hint && localStorage.getItem('qw-shortcuts-seen')) {
            hint.classList.add('seen');
        }

        // --- Auto-add role="alert" to error/warning alerts for screen readers ---
        document.querySelectorAll('.alert-error, .alert-warning').forEach(function(el) {
            if (!el.hasAttribute('role')) el.setAttribute('role', 'alert');
        });

        // --- Apply accessibility preferences from localStorage ---
        var a11yRaw = localStorage.getItem('qw-a11y');
        if (a11yRaw) {
            try {
                var a11yPrefs = JSON.parse(a11yRaw);
                if (a11yPrefs.dyslexiaFont) document.body.classList.add('dyslexia-font');
                if (a11yPrefs.dyslexiaSpacing) document.body.classList.add('dyslexia-spacing');
                if (a11yPrefs.colorBlind) document.body.classList.add('color-blind-mode');
            } catch(e) {}
        }

        // --- Nav dropdown toggle (for mobile/touch) ---
        document.querySelectorAll('.nav-dropdown-toggle').forEach(function(toggle) {
            toggle.addEventListener('click', function(e) {
                e.preventDefault();
                var parent = this.parentElement;
                parent.classList.toggle('open');
                var expanded = parent.classList.contains('open');
                this.setAttribute('aria-expanded', expanded);
            });
        });

        // --- AI Notice Dismiss (sessionStorage) ---
        document.querySelectorAll('.ai-notice[data-dismiss-key]').forEach(function(notice) {
            var key = 'qw_dismissed_' + notice.getAttribute('data-dismiss-key');
            if (sessionStorage.getItem(key) === 'true') {
                notice.style.display = 'none';
            }
            var btn = notice.querySelector('.ai-notice-dismiss');
            if (btn) {
                btn.addEventListener('click', function() {
                    sessionStorage.setItem(key, 'true');
                    notice.style.display = 'none';
                });
            }
        });
    });
    </script>
    <script src="{{ url_for('static', filename='js/loading.js') }}"></script>
    <script src="{{ url_for('static', filename='js/shortcuts.js') }}"></script>
    {% block scripts %}{% endblock %}
    <script>
    // Register PWA service worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js').catch(function(err) {
            console.log('SW registration failed:', err);
        });
    }
    </script>
</body>
</html>
